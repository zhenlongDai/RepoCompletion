model_path: "CodeLLM/Qwen2.5-Coder-0.5B-Instruct"
eval_dataset_name: "repobench"
dp_size: 1
tp_size: 1
dp_master_ip: "127.0.0.1"
dp_master_port: 0 #29310
eval_mode: "test"
data_path_dir: "None" #datasets/repobench/java/test
debug_mode: false
language: "None"  # Options: "java", "python"
max_input_tokens: 10000
max_output_tokens: 1000
save_file_path: "output_dir/generation/repobench/java/QwenCoder0.5B.json"
system_prompt: "You are a helpful assistant tasked with completing the next line of a repository-level code file.
 You are provided with an incomplete code file and other code snippets from the same repository. 
 You first think about the reasoning process as an internal monologue that infers the user's intent of completion. 
 Then, you should provide the user with the next line of the incomplete code.
 The reasoning process should be enclosed within <think> and </think> tags, while the final answer should be enclosed within <answer> and </answer> tags. 
 Please respond in the following format: <think>\n...\n</think>\n<answer>\n```...```\n</answer>"
temperature: 0.7
top_p: 1.0
gpu_memory_utilization: 0.25
dtype: "float16"
use_lora: false
