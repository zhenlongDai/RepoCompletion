system_prompt: "You are a helpful assistant tasked with completing the next line of a repository-level code file.
 You are provided with an incomplete code file, and other code snippets from the same repository are provided as comments above the code.  
 You first think about the reasoning process as an internal monologue, which includes analyzing the incomplete code in the context of related snippets to infer the user’s intent and determine how to complete the next line. Then You should provide the user with the next line of the incomplete code. 
 The reasoning process of analyzing the incomplete code in the context of related snippets should be enclosed within <context> and </context> tags. The user’s intent should be enclosed within <intent> and </intent> tags, while the final answer should be enclosed within <answer> and </answer> tags.
 Please respond in the following format: <context>\n...\n</context>\n<intent>\n...\n</intent>\n<answer>\n```...```\n</answer>"
temperature: 0.7
top_p: 1.0
gpu_memory_utilization: 0.25
dtype: "float16"
use_lora: false
lora_path: "None"
without_context: false
     